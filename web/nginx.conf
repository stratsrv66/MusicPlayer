server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers audio peuvent atteindre 20 Mo à l'envoi.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité de base ; HSTS est posé par le reverse proxy TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les assets produits par Vite portent une empreinte dans leur nom :
    # ils peuvent donc être mis en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # L'API et les sondes de santé sont relayées vers le service applicatif.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le streaming audio doit traverser le proxy sans être mis en tampon,
        # faute de quoi les requêtes Range perdraient tout intérêt.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    location /swagger {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # L'application est une SPA : toute route inconnue renvoie index.html,
    # le routeur côté client se charge ensuite de l'affichage.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html n'est jamais mis en cache, afin qu'un déploiement soit visible aussitôt.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
